# Gated research template. The CLI dispatches this to the research study driver.
# First run research smoke, pilot and graph with the same research_output directory.
# The driver resolves the common training budget from the passing pilot gate.
[study]
research_protocol = true
research_output = "results/research"
kg_completeness_values = [0, 0.25, 0.5, 0.75, 1.0]

[study.base_config]
total_timesteps = 1000000
n_envs = 8
kg_completeness = 1.0
seeds = [42, 7, 123, 456, 789]

[study.base_config.game_manager]
num_tiles = 12
number_of_outposts = 3
screen_size = 480
vision_range = 2
headless = true

[study.base_config.simulation_manager]
number_of_environments = 150
number_of_curricula = 1

[study.base_config.algorithm]
algorithm = "PPO"
verbose = 0

[study.base_config.algorithm.hyperparameters]
n_steps = 250
batch_size = 50
n_epochs = 5
learning_rate = 0.0003
gamma = 0.99
ent_coef = 0.01

[study.base_config.episode]
max_episode_steps = 300
max_steps_without_progress = 100

[study.base_config.evaluation]
eval_freq = 100000
n_eval_episodes = 10
final_eval_episodes = 50

[study.base_config.ablation]
disable_curriculum = true

[study.base_config.feature_encoding]
strategy = "one_hot"
