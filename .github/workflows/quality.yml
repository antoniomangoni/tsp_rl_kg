name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main

permissions:
  contents: read

env:
  MPLBACKEND: Agg
  PYGAME_HIDE_SUPPORT_PROMPT: "1"
  SDL_VIDEODRIVER: dummy
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  CUDA_VISIBLE_DEVICES: ""

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked

      - name: Run pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

  pytest:
    name: pytest
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked

      - name: Run unit tests
        run: uv run pytest tests/ -v -m "not integration"

      - name: Run CPU integration tests
        run: uv run pytest tests/ -v -m integration
