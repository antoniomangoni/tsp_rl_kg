name: Closed-tour learnability
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run python -m tsp_rl_kg.rl.training.research smoke --output results/learnability
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learnability-evidence
          path: results/learnability
